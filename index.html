function init() {
  map = L.map('map', { zoomControl: true }).setView([38.5, -88.0], 6);
  L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png', {
    maxZoom: 18,

  }).addTo(map);

  STORES.forEach(function(s) {
    var color = s.done ? COLORS.complete : COLORS.pending;

    var marker = L.circleMarker([s.lat, s.lng], {

      fillColor: color,
      color: '#fff',
      weight: 1.5,
      opacity: 1,
      fillOpacity: 0.9
    }).addTo(map);

    markers.push(marker);

  activePhase = phase;
  var btns = document.querySelectorAll('.phase-btn');
  for (var j = 0; j < btns.length; j++) {
    if (j === phase) btns[j].classList.add('active');
    else btns[j].classList.remove('active');
  }

  var completeCount = 0, remainingCount = 0;
  markers.forEach(function(m) {
    var s = m._storeData;
    var show = phase === 0 || s.p === phase;
    if (show) {
      m.setStyle({ opacity: 1, fillOpacity: 0.9 });
      m.setRadius(s.done ? 8 : 6);
      if (s.done) completeCount++; else remainingCount++;
    } else {
      m.setStyle({ opacity: 0.15, fillOpacity: 0.15 });
      m.setRadius(4);
    }
  });

  document.getElementById('complete-count').textContent = completeCount;
  document.getElementById('remaining-count').textContent = remainingCount;
}

init();
</script>
</body>
</html>
