var STATUS_META=[{key:'complete',label:'Complete',color:'#2e8b57'},{key:'ready',label:'Ready',color:'#17a2b8'},{key:'watch',label:'Watch',color:'#b8860b'},{key:'atrisk',label:'At Risk',color:'#c84040'},{key:'pending',label:'Pending',color:'#7b4fbf'}];
var map,markers=[],activePhase=0,activeStatuses=null,highlightCircle=null;
function init(){
  map=L.map('map',{zoomControl:true}).setView([38.5,-88.0],6);
  L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
  STORES.forEach(function(s){
    var meta=STATUS_META.find(function(m){return m.key===s.st})||STATUS_META[4];
    var r=s.st==='complete'?8:s.st==='atrisk'?9:s.st==='watch'?8:6;
    var mk=L.circleMarker([s.lat,s.lng],{radius:r,fillColor:meta.color,color:'#fff',weight:1.5,opacity:1,fillOpacity:0.9}).addTo(map);
    var lb={complete:'Complete',ready:'Ready',watch:'Watch',atrisk:'At Risk',pending:'Scheduled'};
    mk.bindPopup('<div class="store-popup"><h3>Huck\'s '+s.n+'</h3><div class="meta">'+s.c+'</div><div class="meta">Phase '+s.p+' &middot; Install: '+s.i+'</div><span class="status-badge" style="background:'+meta.color+'">'+(lb[s.st]||'Scheduled')+'</span></div>');
    mk._storeData=s;mk._meta=meta;markers.push(mk);
  });
  var lc=L.control({position:'bottomleft'});
  lc.onAdd=function(){var d=L.DomUtil.create('div','map-legend');d.id='mapLegend';L.DomEvent.disableClickPropagation(d);return d;};
  lc.addTo(map);buildLegend();buildStatusBtns();initSearch();
}
function buildLegend(){
  var el=document.getElementById('mapLegend');if(!el)return;
  var c={};STATUS_META.forEach(function(m){c[m.key]=0;});
  markers.forEach(function(mk){var s=mk._storeData;if((activePhase===0||s.p===activePhase)&&(!activeStatuses||activeStatuses[s.st]))c[s.st]++;});
  var h='<h4>Legend</h4>';STATUS_META.forEach(function(m){h+='<div class="legend-row"><span class="legend-circle" style="background:'+m.color+'"></span><span>'+m.label+'</span><span class="legend-count">'+c[m.key]+'</span></div>';});
  el.innerHTML=h;
}
function buildStatusBtns(){
  var ct=document.getElementById('statusFilters');
  STATUS_META.forEach(function(m){var b=document.createElement('button');b.className='st-btn active';b.setAttribute('data-st',m.key);b.innerHTML='<span class="dot" style="background:'+m.color+'"></span>'+m.label;b.onclick=function(){toggleStatus(m.key);};ct.appendChild(b);});
}
function toggleStatus(k){
  if(!activeStatuses){activeStatuses={};STATUS_META.forEach(function(m){activeStatuses[m.key]=true;});}
  activeStatuses[k]=!activeStatuses[k];
  if(STATUS_META.every(function(m){return activeStatuses[m.key];}))activeStatuses=null;
  applyFilters();
}
function filterPhase(p){
  activePhase=p;var bs=document.querySelectorAll('.phase-btn');
  for(var j=0;j<bs.length;j++){if(j===p)bs[j].classList.add('active');else bs[j].classList.remove('active');}
  applyFilters();
}
function applyFilters(){
  var c={complete:0,ready:0,watch:0,atrisk:0,pending:0};
  markers.forEach(function(m){var s=m._storeData;var ok=(activePhase===0||s.p===activePhase)&&(!activeStatuses||activeStatuses[s.st]);
    if(ok){m.setStyle({opacity:1,fillOpacity:0.9});m.setRadius(s.st==='complete'?8:s.st==='atrisk'?9:s.st==='watch'?8:6);c[s.st]++;}
    else{m.setStyle({opacity:0.08,fillOpacity:0.08});m.setRadius(3);}
  });
  document.getElementById('cnt-complete').textContent=c.complete;document.getElementById('cnt-ready').textContent=c.ready;
  document.getElementById('cnt-watch').textContent=c.watch;document.getElementById('cnt-atrisk').textContent=c.atrisk;
  document.getElementById('cnt-pending').textContent=c.pending;
  var sb=document.querySelectorAll('.st-btn');for(var i=0;i<sb.length;i++){var k=sb[i].getAttribute('data-st');
    if(!activeStatuses||activeStatuses[k]){sb[i].classList.add('active');sb[i].classList.remove('dimmed');}
    else{sb[i].classList.remove('active');sb[i].classList.add('dimmed');}
  }buildLegend();
}
function initSearch(){
  var inp=document.getElementById('searchInput'),res=document.getElementById('searchResults');
  inp.addEventListener('input',function(){
    var q=this.value.trim().toLowerCase();if(q.length<1){res.classList.remove('open');return;}
    var m=STORES.filter(function(s){var n=s.n.toLowerCase().replace('#','');var qc=q.replace('#','');return n.indexOf(qc)!==-1||s.c.toLowerCase().indexOf(q)!==-1;}).slice(0,10);
    if(!m.length){res.innerHTML='<div class="sr-none">No stores found</div>';}
    else{res.innerHTML=m.map(function(s){var mt=STATUS_META.find(function(x){return x.key===s.st;})||STATUS_META[4];return'<div class="sr-item" data-store="'+s.n+'"><span class="sr-dot" style="background:'+mt.color+'"></span><span class="sr-name">Huck\'s '+s.n+'</span><span class="sr-city">Ph '+s.p+' &middot; '+s.c+'</span></div>';}).join('');}
    res.classList.add('open');
    var it=res.querySelectorAll('.sr-item');for(var i=0;i<it.length;i++){it[i].addEventListener('click',function(){var sn=this.getAttribute('data-store');flyToStore(sn);res.classList.remove('open');inp.value=sn;});}
  });
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){var f=res.querySelector('.sr-item');if(f){flyToStore(f.getAttribute('data-store'));res.classList.remove('open');inp.value=f.getAttribute('data-store');}}if(e.key==='Escape'){res.classList.remove('open');inp.blur();}});
  document.addEventListener('click',function(e){if(!e.target.closest('.search-wrap'))res.classList.remove('open');});
}
function flyToStore(sn){
  var mk=markers.find(function(m){return m._storeData.n===sn;});if(!mk)return;
  var s=mk._storeData;map.flyTo([s.lat,s.lng],12,{duration:0.8});
  mk.setStyle({opacity:1,fillOpacity:0.9});mk.setRadius(10);
  if(highlightCircle){map.removeLayer(highlightCircle);}
  highlightCircle=L.circleMarker([s.lat,s.lng],{radius:18,fillColor:'transparent',fillOpacity:0,color:'#58a6ff',weight:3,opacity:0.8}).addTo(map);
  setTimeout(function(){mk.openPopup();},900);
  setTimeout(function(){if(highlightCircle){map.removeLayer(highlightCircle);highlightCircle=null;}applyFilters();},4000);
}
init();
</script>
