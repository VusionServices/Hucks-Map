function applyFilters(){var t=searchTerm.toLowerCase();allMarkers.forEach(function(m){var d=m._storeData;var show=activeStatuses[d.status];if(activePhase>0&&d.phase!==activePhase)show=false;if(t&&!d.name.toLowerCase().includes(t)&&!m.getPopup().getContent().toLowerCase().includes(t))show=false;if(show){if(!map.hasLayer(m))m.addTo(map);}else{if(map.hasLayer(m))map.removeLayer(m);}});}
var COLORS={complete:'#16a34a',ready:'#f97316',shipped:'#3b82f6',pending:'#8b5cf6'};
function toggleStatus(s){activeStatuses[s]=!activeStatuses[s];var b=document.getElementById('btn-'+s);if(activeStatuses[s]){b.classList.remove('inactive');b.style.background=COLORS[s];b.style.color='#fff';}else{b.classList.add('inactive');b.style.background='transparent';b.style.color=COLORS[s];}applyFilters();}
function filterPhase(p){activePhase=p;document.querySelectorAll('.phase-btn').forEach(function(b){b.classList.remove('active');});document.getElementById(p===0?'ph-all':'ph-'+p).classList.add('active');applyFilters();}
document.getElementById('search').addEventListener('input',function(e){searchTerm=e.target.value;applyFilters();});
