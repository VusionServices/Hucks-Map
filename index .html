<style>
:root{--green:#2e8b57;--green-light:#e8f5ee;--teal:#e67e22;--teal-light:#fdf2e6;--purple:#7b4fbf;--purple-light:#f3eefa;--yellow:#b8860b;--yellow-light:#fdf6e3;--red:#c84040;--red-light:#fce8e8;--nav-bg:oklch(18% .015 240);--surface:#f5f4f2;--surface-el:#fff;--border:#e2e0dc;--text-pri:#1a1a1a;--text-sec:#444;--text-ter:#777}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--surface);color:var(--text-pri);line-height:1.5;font-size:14px;-webkit-font-smoothing:antialiased}
.nav{position:sticky;top:0;z-index:1000;background:var(--nav-bg);padding:12px 24px;display:flex;align-items:center;gap:16px}
.nav-brand{color:#fff;font-size:1.1rem;font-weight:900;letter-spacing:-.02em}
.nav-brand span{color:#e67e22}
.nav-tabs{display:flex;gap:4px;flex:1;overflow-x:auto;margin-left:24px}
.nav-tab{padding:5px 10px;border-radius:5px;font-size:.76rem;font-weight:700;color:#b1b9be;background:none;border:none;cursor:pointer;font-family:inherit;white-space:nowrap}
.nav-tab:hover,.nav-tab.active{background:#252a2d;color:#e2e5e8}
.nav-date{font-size:.74rem;color:#acb2b7;font-weight:600}
.filter-bar{position:sticky;top:56px;z-index:999;background:var(--surface);padding:12px 24px;border-bottom:1px solid var(--border);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.phase-lbl{padding:6px 12px;border-radius:6px;font-size:.76rem;font-weight:700;cursor:pointer;border:2px solid var(--border);background:var(--surface-el);color:var(--text-sec);transition:all .15s;user-select:none}
.phase-lbl.on{border-color:#e67e22;background:var(--teal-light);color:#8a4a00}
.week-sel{font-size:.82rem;font-weight:700;color:var(--text-pri);background:var(--surface-el);border:2px solid var(--border);border-radius:6px;padding:6px 12px;cursor:pointer;font-family:inherit}
.db{max-width:1500px;margin:0 auto;padding:24px}
section{margin-bottom:32px;scroll-margin-top:120px}
.sh{font-size:1.1rem;font-weight:900;margin-bottom:12px}
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.kc{background:var(--surface-el);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;cursor:pointer;transition:transform .12s}
.kc:hover{transform:scale(1.04)}
.kc-ready{background:var(--teal-light);border-color:var(--teal)}
.kc-pending{background:var(--purple-light);border-color:var(--purple)}
.kc-watch{background:var(--yellow-light);border-color:var(--yellow)}
.kc-atrisk{background:var(--red-light);border-color:var(--red)}
.kc-overall{background:linear-gradient(135deg,#1a4d2e,#1f5c36);border:2px solid var(--green)}
.kc-overall .kv{color:#fff;font-size:1.5rem}
.kc-overall .kl{color:#ffffffbf}
.kv{font-size:1.2rem;font-weight:900}
.kv.teal{color:var(--teal)}.kv.purple{color:var(--purple)}.kv.yellow{color:var(--yellow)}.kv.red{color:var(--red)}
.kl{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-ter);margin-top:2px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.panel{background:var(--surface-el);border:1px solid var(--border);border-radius:12px;padding:16px}
.chart-box{height:220px;position:relative}
.prereq-section{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.prereq-card{background:var(--surface-el);border:1px solid var(--border);border-radius:10px;padding:14px}
.prereq-title{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--text-ter);margin-bottom:10px}
.prereq-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.prereq-stat{text-align:center;padding:8px 4px;border-radius:6px;cursor:pointer;transition:transform .12s;border:none;font-family:inherit;background:transparent}
.prereq-stat:hover{transform:scale(1.08)}
.prereq-stat-val{font-size:1rem;font-weight:900}
.prereq-stat-lbl{font-size:.62rem;font-weight:700;text-transform:uppercase}
.ps-teal{background:var(--teal-light);color:#8a4a00}
.ps-purple{background:var(--purple-light);color:#5b2fa0}
.ps-yellow{background:var(--yellow-light);color:#7a5700}
.ps-red{background:var(--red-light);color:#a32020}
table{width:100%;border-collapse:collapse;font-size:.76rem}
th{text-align:left;font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--text-ter);padding:8px;border-bottom:2px solid var(--border);white-space:nowrap}
td{padding:8px;font-weight:600;border-bottom:1px solid #f0eeeb;white-space:nowrap}
.b{display:inline-block;padding:2px 7px;border-radius:4px;font-size:.68rem;font-weight:800;text-transform:uppercase}
.bt{background:var(--teal-light);color:#8a4a00}
.bp{background:var(--purple-light);color:#5b2fa0}
.by{background:var(--yellow-light);color:#7a5700}
.br{background:var(--red-light);color:#a32020}
.buf-pos{color:#8a4a00;font-weight:800}.buf-neg{color:#a32020;font-weight:800}
#map{height:420px;border-radius:10px;border:1px solid var(--border)}
.modal-overlay{display:none;position:fixed;inset:0;background:#00000060;z-index:2000;align-items:center;justify-content:center;padding:24px}
.modal-overlay.open{display:flex}
.modal{background:var(--surface-el);border-radius:14px;max-width:640px;width:100%;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 20px 60px #00000040}
.modal-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:1rem;font-weight:900}
.modal-count{font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:5px}
.modal-close{width:28px;height:28px;border-radius:6px;border:none;background:var(--surface);cursor:pointer;font-size:1rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.modal-body{overflow-y:auto;padding:12px 20px 20px}
.footer{padding-top:12px;border-top:1px solid var(--border);font-size:.7rem;color:var(--text-ter);font-weight:600;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:32px}
@media(max-width:1024px){.grid-2,.prereq-section{grid-template-columns:1fr}}
@media(max-width:768px){.kg{grid-template-columns:repeat(2,1fr)}.nav-tabs{display:none}}
</style>
</head>

let activePhases = ["All"];
let activeWeek = "All";

function parseDate(d){ const p=d.split('/'); return new Date(2000+parseInt(p[2]),parseInt(p[0])-1,parseInt(p[1])); }
const TODAY = new Date(2026,7,27);

function getFiltered(){
  let f = S;
  if(!activePhases.includes("All")) f = f.filter(s=>activePhases.includes(s.p));
  if(activeWeek!=="All"){
    f = f.filter(s=>{
      const d=parseDate(s.d);
      const mon=new Date(d);mon.setDate(d.getDate()-d.getDay()+1);
      return mon.toISOString().slice(0,10)===activeWeek;
    });
  }
  return f;
}

function badge(status){
  const m={ready:'bt',pending:'bp',watch:'by',atrisk:'br'};
  return `<span class="b ${m[status]||'bp'}">${status==='atrisk'?'AT RISK':status.toUpperCase()}</span>`;
}

function renderKPIs(){
  const f=getFiltered();
  const ready=f.filter(s=>s.o==='ready').length;
  const pending=f.filter(s=>s.o==='pending').length;
  const watch=f.filter(s=>s.o==='watch').length;
  const atrisk=f.filter(s=>s.o==='atrisk').length;
  const total=f.length;
  document.getElementById('kpiGrid').innerHTML=`
    <div class="kc kc-overall" onclick="showModal('Total Stores',f=>true)"><div class="kv">${total}</div><div class="kl">Total Stores</div></div>
    <div class="kc kc-ready" onclick="showModal('Ready',s=>s.o==='ready')"><div class="kv teal">${ready}</div><div class="kl">Ready</div></div>
    <div class="kc kc-pending" onclick="showModal('Pending',s=>s.o==='pending')"><div class="kv purple">${pending}</div><div class="kl">Pending</div></div>
    <div class="kc kc-watch" onclick="showModal('Watch',s=>s.o==='watch')"><div class="kv yellow">${watch}</div><div class="kl">Watch</div></div>
    <div class="kc kc-atrisk" onclick="showModal('At Risk',s=>s.o==='atrisk')"><div class="kv red">${atrisk}</div><div class="kl">At Risk</div></div>
  `;
}

function renderCharts(){
  const f=getFiltered();
  const ready=f.filter(s=>s.o==='ready').length;
  const pending=f.filter(s=>s.o==='pending').length;
  const watch=f.filter(s=>s.o==='watch').length;
  const atrisk=f.filter(s=>s.o==='atrisk').length;
  
  if(window._barChart) window._barChart.destroy();
  window._barChart=new Chart(document.getElementById('chartBar'),{
    type:'bar',
    data:{labels:['Ready','Pending','Watch','At Risk'],datasets:[{data:[ready,pending,watch,atrisk],backgroundColor:['#e67e22','#7b4fbf','#b8860b','#c84040'],borderRadius:6}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},title:{display:true,text:'Readiness Distribution',font:{size:13,weight:800}}},scales:{y:{beginAtZero:true}}}
  });

  // Planned vs actual by week
  const weeks={};
  f.forEach(s=>{
    const d=parseDate(s.d);
    const mon=new Date(d);mon.setDate(d.getDate()-d.getDay()+1);
    const k=mon.toISOString().slice(5,10);
    if(!weeks[k])weeks[k]={planned:0,ready:0};
    weeks[k].planned++;
    if(s.o==='ready')weeks[k].ready++;
  });
  const wks=Object.keys(weeks).sort();
  if(window._lineChart) window._lineChart.destroy();
  window._lineChart=new Chart(document.getElementById('chartLine'),{
    type:'line',
    data:{labels:wks,datasets:[
      {label:'Planned',data:wks.map(w=>weeks[w].planned),borderColor:'#7b4fbf',backgroundColor:'#7b4fbf22',fill:true,tension:.3},
      {label:'Ready',data:wks.map(w=>weeks[w].ready),borderColor:'#e67e22',backgroundColor:'#e67e2222',fill:true,tension:.3}
    ]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{title:{display:true,text:'Planned vs Ready by Week',font:{size:13,weight:800}}},scales:{y:{beginAtZero:true}}}
  });
}

function renderPrereqs(){
  const f=getFiltered();
  const count=(arr,st)=>arr.filter(s=>s===st).length;
  const apStatuses=f.map(s=>s.ap);
  const matStatuses=f.map(s=>s.mat);
  const fixStatuses=f.map(s=>s.fix);
  
  function card(title,statuses,field){
    const r=count(statuses,'ready'),p=count(statuses,'pending'),w=count(statuses,'watch'),a=count(statuses,'atrisk');
    return `<div class="prereq-card">
      <div class="prereq-title">${title}</div>
      <div class="prereq-stats">
        <button class="prereq-stat ps-teal" onclick="showPrereqModal('${title}','ready','${field}')"><div class="prereq-stat-val">${r}</div><div class="prereq-stat-lbl">Ready</div></button>
        <button class="prereq-stat ps-purple" onclick="showPrereqModal('${title}','pending','${field}')"><div class="prereq-stat-val">${p}</div><div class="prereq-stat-lbl">Pending</div></button>
        <button class="prereq-stat ps-yellow" onclick="showPrereqModal('${title}','watch','${field}')"><div class="prereq-stat-val">${w}</div><div class="prereq-stat-lbl">Watch</div></button>
        <button class="prereq-stat ps-red" onclick="showPrereqModal('${title}','atrisk','${field}')"><div class="prereq-stat-val">${a}</div><div class="prereq-stat-lbl">At Risk</div></button>
      </div>
    </div>`;
  }
  document.getElementById('prereqCards').innerHTML=card('AP Status',apStatuses,'ap')+card('Vusion Material',matStatuses,'mat')+card('Fixture / Adaptor',fixStatuses,'fix');
}

function renderTable(){
  const f=getFiltered();
  const thead=`<tr><th>Store</th><th>City</th><th>Phase</th><th>Install</th><th>AP</th><th>Material</th><th>Fixture</th><th>Overall</th><th>Buffer</th></tr>`;
  let tbody='';
  f.sort((a,b)=>{const s={atrisk:0,watch:1,pending:2,ready:3};return(s[a.o]||2)-(s[b.o]||2);});
  f.forEach(s=>{
    const minBuf=Math.min(s.apB,s.matB,s.fixB);
    const bufCls=minBuf<0?'buf-neg':'buf-pos';
    tbody+=`<tr><td><strong>${s.n}</strong></td><td>${s.c}, ${s.st}</td><td>${s.p}</td><td>${s.d}</td><td>${badge(s.ap)}</td><td>${badge(s.mat)}</td><td>${badge(s.fix)}</td><td>${badge(s.o)}</td><td class="${bufCls}">${minBuf}d</td></tr>`;
  });
  const t=document.getElementById('readyTable');
  t.querySelector('thead').innerHTML=thead;
  t.querySelector('tbody').innerHTML=tbody;
}

function renderPriority(){
  const f=getFiltered().filter(s=>s.o==='watch'||s.o==='atrisk');
  f.sort((a,b)=>{const s={atrisk:0,watch:1};return(s[a.o]||1)-(s[b.o]||1);});
  const thead=`<tr><th>#</th><th>Store</th><th>City</th><th>Install</th><th>Issue</th><th>Status</th><th>Buffer</th></tr>`;
  let tbody='';
  if(f.length===0) tbody='<tr><td colspan="7" style="text-align:center;padding:20px;color:var(--text-ter)">No priority actions at this time</td></tr>';
  f.forEach((s,i)=>{
    let issue=[];
    if(s.ap==='atrisk'||s.ap==='watch') issue.push('AP');
    if(s.mat==='atrisk'||s.mat==='watch') issue.push('Material');
    if(s.fix==='atrisk'||s.fix==='watch') issue.push('Fixture');
    const minBuf=Math.min(s.apB,s.matB,s.fixB);
    tbody+=`<tr><td>${i+1}</td><td><strong>${s.n}</strong></td><td>${s.c}, ${s.st}</td><td>${s.d}</td><td>${issue.join(', ')}</td><td>${badge(s.o)}</td><td class="buf-neg">${minBuf}d</td></tr>`;
  });
  const t=document.getElementById('prioTable');
  t.querySelector('thead').innerHTML=thead;
  t.querySelector('tbody').innerHTML=tbody;
}

function renderExecution(){
  const f=getFiltered();
  const thead=`<tr><th>Store</th><th>City</th><th>Phase</th><th>Install Date</th><th>Vendor</th><th>Status</th></tr>`;
  let tbody='';
  f.forEach(s=>{
    tbody+=`<tr><td><strong>${s.n}</strong></td><td>${s.c}, ${s.st}</td><td>${s.p}</td><td>${s.d}</td><td>${s.v}</td><td>${badge(s.o)}</td></tr>`;
  });
  const t=document.getElementById('execTable');
  t.querySelector('thead').innerHTML=thead;
  t.querySelector('tbody').innerHTML=tbody;
}

function renderMap(){
  const el=document.getElementById('mapContainer');
  el.innerHTML='<div id="map"></div>';
  const map=L.map('map').setView([38.5,-88.5],6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'OSM'}).addTo(map);
  const colors={ready:'#e67e22',pending:'#7b4fbf',watch:'#b8860b',atrisk:'#c84040'};
  const f=getFiltered();
  f.forEach(s=>{
    const coords=GEO[s.c];
    if(!coords) return;
    const jitter=[coords[0]+(Math.random()-.5)*.02, coords[1]+(Math.random()-.5)*.02];
    L.circleMarker(jitter,{radius:7,fillColor:colors[s.o]||'#7b4fbf',color:'#fff',weight:1.5,fillOpacity:.85})
      .bindPopup(`<strong>${s.n}</strong><br>${s.c}, ${s.st}<br>Install: ${s.d}<br>Status: ${s.o.toUpperCase()}`)
      .addTo(map);
  });
}

function renderFilters(){
  const phases=[...new Set(S.map(s=>s.p))].sort();
  let html='<span class="phase-lbl on" onclick="togglePhase(this,\'All\')">All</span>';
  phases.forEach(p=>{html+=`<span class="phase-lbl" onclick="togglePhase(this,'${p}')">${p}</span>`;});
  // Week dropdown
  const weeks=new Set();
  S.forEach(s=>{const d=parseDate(s.d);const mon=new Date(d);mon.setDate(d.getDate()-d.getDay()+1);weeks.add(mon.toISOString().slice(0,10));});
  const sorted=[...weeks].sort();
  html+='<select class="week-sel" onchange="setWeek(this.value)"><option value="All">All Weeks</option>';
  sorted.forEach(w=>{
    const d=new Date(w+'T12:00:00');
    html+=`<option value="${w}">Wk ${d.getMonth()+1}/${d.getDate()}</option>`;
  });
  html+='</select>';
  document.getElementById('filterBar').innerHTML=html;
}

function togglePhase(el,phase){
  if(phase==='All'){activePhases=['All'];}
  else{activePhases=activePhases.filter(p=>p!=='All');
    if(activePhases.includes(phase))activePhases=activePhases.filter(p=>p!==phase);
    else activePhases.push(phase);
    if(activePhases.length===0)activePhases=['All'];
  }
  document.querySelectorAll('.phase-lbl').forEach(e=>{
    e.classList.toggle('on',activePhases.includes('All')?e.textContent==='All':activePhases.includes(e.textContent));
  });
  renderAll();
}

function setWeek(w){activeWeek=w;renderAll();}

function renderAll(){renderKPIs();renderCharts();renderPrereqs();renderTable();renderPriority();renderExecution();renderMap();}

function showModal(title,filterFn){
  const f=getFiltered().filter(filterFn);
  document.getElementById('modalTitle').textContent=title+' ('+f.length+')';
  let html='<table><thead><tr><th>Store</th><th>City</th><th>Phase</th><th>Install</th><th>AP</th><th>Mat</th><th>Fix</th></tr></thead><tbody>';
  f.forEach(s=>{html+=`<tr><td><strong>${s.n}</strong></td><td>${s.c}, ${s.st}</td><td>${s.p}</td><td>${s.d}</td><td>${badge(s.ap)}</td><td>${badge(s.mat)}</td><td>${badge(s.fix)}</td></tr>`;});
  html+='</tbody></table>';
  document.getElementById('modalBody').innerHTML=html;
  document.getElementById('modal').classList.add('open');
}

function showPrereqModal(title,status,field){
  const f=getFiltered().filter(s=>s[field]===status);
  document.getElementById('modalTitle').textContent=title+' - '+status.toUpperCase()+' ('+f.length+')';
  let html='<table><thead><tr><th>Store</th><th>City</th><th>Phase</th><th>Install</th><th>Status</th></tr></thead><tbody>';
  f.forEach(s=>{html+=`<tr><td><strong>${s.n}</strong></td><td>${s.c}, ${s.st}</td><td>${s.p}</td><td>${s.d}</td><td>${badge(s[field])}</td></tr>`;});
  html+='</tbody></table>';
  document.getElementById('modalBody').innerHTML=html;
  document.getElementById('modal').classList.add('open');
}

function closeModal(){document.getElementById('modal').classList.remove('open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

function scrollTo_(id){document.getElementById(id)?.scrollIntoView({behavior:'smooth'});}

renderFilters();
renderAll();
</script>
</body>
</html>
